[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adblock = { version = "0.13.2", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
ureq = "2"
sha2 = "0.10"
# The models ship as raw bytes and are base64-encoded on demand for
# the one delivery that cannot fetch them (see models_script in lib.rs).
base64 = "0.22"


# JNI so the Android WebViewClient can ask the adblock engine about a
# request synchronously. shouldInterceptRequest runs on a background
# thread and must answer immediately — routing it through a Tauri
# command (which is JS-facing and async) is not an option.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# WebView2 request interception on desktop. Tauri/wry expose no general
# http interception, so the block hook is installed straight on the
# ICoreWebView2 (AddWebResourceRequestedFilter + WebResourceRequested) —
# the desktop counterpart of Android's shouldInterceptRequest.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  # SHCreateMemStream: an IStream over bytes we own, which is how a
  # WebResourceRequested handler answers with a body of its own.
  "Win32_UI_Shell",
] }
