<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tamescroll</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="head">
        <h1>Your feeds. Nothing else.</h1>
        <p class="sub">No home feed, no Shorts, no recommendations. Everything you actually came for is still here.</p>
      </header>

      <section class="tiles" id="tiles" aria-label="Platforms"></section>

      <!-- Stage A only: a single on/off toggle. Stage B (docs/plan.md
           Phase 4) replaces this row with the three-mode picker. -->
      <section class="setting" aria-label="Gaze settings">
        <div class="setting-row">
          <span class="setting-label">Blur imagery</span>
          <div class="toggle" id="blur-toggle" role="radiogroup" aria-label="Blur imagery">
            <button type="button" class="toggle-opt" role="radio" data-value="0">Off</button>
            <button type="button" class="toggle-opt" role="radio" data-value="1">On</button>
          </div>
        </div>
        <p class="setting-caption">Blurs pictures on the pages you browse. What you open plays normally.</p>
      </section>

      <footer class="foot">
        <span id="status" class="status"></span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
