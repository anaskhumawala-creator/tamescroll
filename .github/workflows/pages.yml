# Publishes web/ (the site, privacy policy and terms) to GitHub Pages, so
# Play Console has a public privacy-policy URL. Settings -> Pages: Source
# GitHub Actions, custom domain tamescroll.com (DNS: four A records to
# 185.199.108-111.153, www CNAME tamescroll.github.io), Enforce HTTPS.
# Then: https://tamescroll.com/privacy.html
name: Site

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
