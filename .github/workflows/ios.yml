name: iOS

# The iPhone build (#16). Runs on GitHub's macOS runners so nobody needs a
# Mac: it generates the Xcode project, builds the app for the iPhone
# simulator, launches it, and uploads a screenshot as proof it starts.
#
# The Xcode project (app/src-tauri/gen/apple) is regenerated on every run
# by `tauri ios init` rather than committed, so everything iOS-specific
# lives in tauri.conf.json, Info.ios.plist and our own plugin code, where
# a reviewer can read it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS simulator build
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # App Store Connect refuses uploads built with an SDK older than
      # iOS 26 (first upload, 2026-10-27), so use the newest Xcode 26
      # on the runner. The simulator job uses the same one, so what CI
      # tests is what ships.
      - name: Xcode 26
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "no Xcode 26 on this runner:"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ios-sim

      - name: Tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      - run: pnpm install --frozen-lockfile

      - name: Generate the Xcode project
        run: pnpm tauri ios init --ci

      # tauri ios init writes Tauri's own placeholder icon; ours lives in
      # icons/ios (full-bleed and opaque, iOS rounds the corners itself).
      - name: Our app icon
        run: |
          SET=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          for f in "$SET"/*.png; do
            n=$(basename "$f")
            [ -f "src-tauri/icons/ios/$n" ] || { echo "no icons/ios/$n"; exit 1; }
            cp "src-tauri/icons/ios/$n" "$f"
          done
          ls "$SET"

      - name: Build for the simulator
        run: pnpm tauri ios build --debug --target aarch64-sim --ci

      - name: Launch in the simulator and take a screenshot
        run: |
          APP=$(find src-tauri/gen/apple -name '*.app' -type d -path '*sim*' | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple -name '*.app' -type d | head -1)
          echo "app bundle: $APP"
          [ -n "$APP" ] || { echo "no .app produced"; find src-tauri/gen/apple -maxdepth 4 -type d | head -80; exit 1; }
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[5-7]' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 20
          mkdir -p ../ios-proof
          xcrun simctl io "$DEVICE" screenshot ../ios-proof/launcher.png
          # The app must still be running: a crash at start would leave
          # the home screen in the screenshot and nothing else to say so.
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i "$BUNDLE"

          # A platform, opened the way a tile tap opens it (debug-only
          # --ts-open argument, see ios_ci_open in lib.rs).
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
          xcrun simctl launch "$DEVICE" "$BUNDLE" --ts-open=youtube
          sleep 35
          xcrun simctl io "$DEVICE" screenshot ../ios-proof/youtube.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i "$BUNDLE"

          # WebKit's verdict on the network block list (prepare_ios_blocker).
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          find "$DATA/Library/Caches" -name content-blocker-status.txt -exec cat {} \; \
            | tee ../ios-proof/content-blocker.txt

          # A link: our tamescroll:// address through the same door a link
          # from another app uses (debug-only --ts-url; simctl openurl stops
          # at a system prompt CI cannot tap).
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
          xcrun simctl launch "$DEVICE" "$BUNDLE" "--ts-url=tamescroll://open/reddit"
          sleep 30
          xcrun simctl io "$DEVICE" screenshot ../ios-proof/reddit-link.png

          {
            echo "--- Info.plist URL types and quick actions"
            /usr/libexec/PlistBuddy -c 'Print CFBundleURLTypes' "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c 'Print UIApplicationShortcutItems' "$APP/Info.plist" || true
          } | tee ../ios-proof/info-plist.txt

      # The owner has no iPhone or Mac, so the simulator build is also put
      # on Appetize.io, which runs it in a browser (his OK, 2026-10-27).
      # Needs the repository secret APPETIZE_API_TOKEN; APPETIZE_PUBLIC_KEY
      # (optional) keeps updating the same app so its link never changes.
      - name: Upload to Appetize
        if: success()
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          [ -n "$APPETIZE_API_TOKEN" ] || { echo "no APPETIZE_API_TOKEN secret, skipping"; exit 0; }
          APP=$(find src-tauri/gen/apple -name '*.app' -type d -path '*sim*' | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple -name '*.app' -type d | head -1)
          (cd "$(dirname "$APP")" && ditto -c -k --keepParent "$(basename "$APP")" "$RUNNER_TEMP/app.zip")
          URL=https://api.appetize.io/v1/apps
          [ -z "$APPETIZE_PUBLIC_KEY" ] || URL="$URL/$APPETIZE_PUBLIC_KEY"
          curl -sS --fail-with-body "$URL" -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@$RUNNER_TEMP/app.zip" -F "platform=ios" \
            -F "note=tamescroll ${GITHUB_SHA::7}" -o "$RUNNER_TEMP/appetize.json"
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/appetize.json'));print('appetize app:',d.get('publicKey'),d.get('appURL'))"

      # The proof goes to a throwaway branch as well as the artifact, so
      # it can be opened without signing in to download an artifact.
      - name: Publish the proof to the ci/ios-proof branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          # A build that fails early leaves no proof folder at all.
          [ -d ios-proof ] || { echo "no proof to publish"; exit 0; }
          cd ios-proof
          for f in *.png; do [ -e "$f" ] && sips -Z 700 "$f" >/dev/null; done
          echo "${{ github.event.pull_request.head.sha }}" > SHA
          git init -q -b ci/ios-proof
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "iOS proof for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/ios-proof

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-proof
          path: ios-proof/
          if-no-files-found: ignore
